name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q runner scoring tools provenance tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Publication validation
        run: python scoring/validate.py
      - name: Immutable provenance sources
        run: python provenance/verify_sources.py
